<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | STACKLY Veterinary Clinic</title>
  <meta name="description" content="The page you're looking for doesn't exist. Return to STACKLY Veterinary Clinic.">
  <link rel="icon" href="Images/stackly-logo.webp" type="image/webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <style>
    .error-page {
      min-height: 100vh;
      background: var(--gradient-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--space-2xl) var(--space-md);
      position: relative;
      overflow: hidden;
    }
    .error-page::before {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(circle at 15% 85%, rgba(212,160,23,0.2), transparent 50%),
        radial-gradient(circle at 85% 15%, rgba(13,148,136,0.3), transparent 50%);
    }
    /* Floating paw shapes */
    .paw-bg {
      position: absolute; inset: 0; pointer-events: none; overflow: hidden;
    }
    .paw-bg span {
      position: absolute;
      font-size: clamp(1.5rem, 3vw, 3rem);
      opacity: 0.06;
      animation: floaty 6s ease-in-out infinite;
    }
    .paw-bg span:nth-child(1) { top:10%; left:8%;   animation-delay:0s; }
    .paw-bg span:nth-child(2) { top:25%; left:82%;  animation-delay:1.2s; }
    .paw-bg span:nth-child(3) { top:60%; left:5%;   animation-delay:2.4s; }
    .paw-bg span:nth-child(4) { top:72%; left:72%;  animation-delay:0.8s; }
    .paw-bg span:nth-child(5) { top:42%; left:92%;  animation-delay:3s; }
    .paw-bg span:nth-child(6) { top:85%; left:40%;  animation-delay:1.8s; }

    .error-inner { position: relative; max-width: 640px; }

    .error-number {
      font-family: var(--font-heading);
      font-size: clamp(6rem, 18vw, 12rem);
      font-weight: 700;
      line-height: 1;
      background: linear-gradient(135deg, var(--color-gold) 30%, #fff8c0 50%, var(--color-gold) 70%);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shine 3s linear infinite;
      margin-bottom: 0;
      letter-spacing: -0.04em;
    }
    .error-pet {
      font-size: clamp(3rem, 8vw, 5rem);
      display: block;
      animation: floaty 4s ease-in-out infinite;
      margin: -0.25em 0 0.25em;
    }
    .error-title {
      font-family: var(--font-heading);
      font-size: clamp(1.4rem, 3vw, 2rem);
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.5rem;
    }
    .error-desc {
      color: rgba(255,255,255,0.75);
      font-size: 1.05rem;
      max-width: 460px;
      margin: 0 auto var(--space-lg);
    }
    .error-actions {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: var(--space-xl);
    }
  </style>
</head>
<body data-page="404">
  <a href="#main-content" class="skip-link">Skip to content</a>
  <header id="site-header" class="site-header"></header>

  <main id="main-content">
    <div class="error-page">
      <div class="paw-bg" aria-hidden="true">
        <span>🐾</span><span>🐾</span><span>🐾</span>
        <span>🐾</span><span>🐾</span><span>🐾</span>
      </div>

      <div class="error-inner" data-animate="fade-up">
        <p class="error-number">404</p>
        <span class="error-pet" role="img" aria-label="confused puppy">🐶</span>
        <h1 class="error-title">Oops! This page wandered off.</h1>
        <p class="error-desc">
          Even our best-trained pets couldn't find this page. It might have been moved, renamed, or never existed. Let's get you back on track.
        </p>
        <div class="error-actions">
          <button onclick="history.back()" class="btn btn-outline">← Go Back</button>
          <a href="index.html" class="btn btn-gold">Home</a>
        </div>
      </div>
    </div>
  </main>

  <script src="assets/js/layout.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
